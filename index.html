<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <form>
            <h1>Login</h1>
            <div class="input"><input type="email" placeholder="Email" required></div>
            <div class="input"><input type="password" placeholder="Senha" required></div>
            <div class="checkbox"><input type="checkbox"> <label for="checkbox">Lembrar-me</label></div>
            <div><button type="submit">Enviar</button></div>
            <div class="forgot"><a href="#">Esqueci a Senha</a></div>
            <div class="register"><p>Não tem uma conta?</p><a href="#">Cadastre-se</a></div>
        </form>
    </main>


</body>
</html>
